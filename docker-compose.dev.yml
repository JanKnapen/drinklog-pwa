services:
  backend:
    env_file:
      - .env
    environment:
      - DEBUG=true

  admin-backend:
    environment:
      - DEBUG=true

  frontend:
    env_file:
      - .env
    volumes:
      - ./nginx.dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/ssl:/certs:ro
    ports:
      - "443:443"
    cap_add:
      - NET_BIND_SERVICE
